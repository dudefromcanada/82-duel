<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>82 Duel — Draft Your Dynasty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0e17;
  --bg2: #111827;
  --bg3: #1a2234;
  --court: #1e3a5f;
  --line: #c4a35a;
  --accent: #e8a838;
  --accent2: #f0c14b;
  --red: #e74c3c;
  --green: #2ecc71;
  --blue: #3498db;
  --text: #f0f2f5;
  --muted: #8b95a8;
  --card: #151d2e;
  --border: #2a3548;
  --p1: #e8a838;
  --p2: #5dade2;
  --safe: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  overflow-x: hidden;
  background-image:
    radial-gradient(ellipse at 50% 0%, rgba(30,58,95,0.45) 0%, transparent 55%),
    linear-gradient(180deg, #0a0e17 0%, #0d1320 100%);
}
h1, h2, h3, .display { font-family: 'Bebas Neue', Impact, sans-serif; letter-spacing: 0.04em; }
button { font-family: inherit; cursor: pointer; border: none; }
input, select { font-family: inherit; }

#app { max-width: 480px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; position: relative; padding-bottom: var(--safe); }

.screen { display: none; flex-direction: column; flex: 1; padding: 16px; animation: fadeIn 0.25s ease; }
.screen.active { display: flex; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.logo {
  text-align: center; padding: 28px 12px 8px;
}
.logo h1 {
  font-size: 3.4rem; line-height: 0.9; color: var(--accent);
  text-shadow: 0 0 40px rgba(232,168,56,0.35);
}
.logo .tag { color: var(--muted); font-size: 0.85rem; margin-top: 6px; letter-spacing: 0.12em; text-transform: uppercase; }

.card {
  background: var(--card); border: 1px solid var(--border); border-radius: 14px;
  padding: 16px; margin: 10px 0;
}
.card h3 { font-size: 1.15rem; color: var(--accent2); margin-bottom: 10px; }

.field { margin-bottom: 12px; }
.field label { display: block; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 5px; }
.field input {
  width: 100%; padding: 12px 14px; border-radius: 10px;
  background: var(--bg2); border: 1px solid var(--border); color: var(--text); font-size: 1rem;
}
.field input:focus { outline: none; border-color: var(--accent); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 14px 20px; border-radius: 12px; font-weight: 600; font-size: 0.95rem;
  transition: transform 0.12s, opacity 0.12s, background 0.12s;
  width: 100%;
}
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.4; pointer-events: none; }
.btn-primary { background: linear-gradient(135deg, var(--accent), #d4891a); color: #1a1205; }
.btn-secondary { background: var(--bg3); color: var(--text); border: 1px solid var(--border); }
.btn-ghost { background: transparent; color: var(--muted); border: 1px dashed var(--border); }
.btn-danger { background: rgba(231,76,60,0.15); color: var(--red); border: 1px solid rgba(231,76,60,0.35); }
.btn-sm { padding: 8px 12px; font-size: 0.78rem; width: auto; border-radius: 8px; }
.btn-row { display: flex; gap: 8px; margin-top: 10px; }
.btn-row .btn { flex: 1; }

.mode-tabs { display: flex; gap: 6px; margin: 8px 0 14px; }
.mode-tabs button {
  flex: 1; padding: 10px; border-radius: 10px; background: var(--bg2);
  color: var(--muted); border: 1px solid var(--border); font-weight: 600; font-size: 0.85rem;
}
.mode-tabs button.on { background: rgba(232,168,56,0.15); color: var(--accent); border-color: var(--accent); }

.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 0 12px; gap: 8px;
}
.topbar .round {
  font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; color: var(--accent);
}
.player-badge {
  font-size: 0.75rem; font-weight: 700; padding: 4px 10px; border-radius: 999px;
  text-transform: uppercase; letter-spacing: 0.06em;
}
.player-badge.p1 { background: rgba(232,168,56,0.2); color: var(--p1); }
.player-badge.p2 { background: rgba(93,173,226,0.2); color: var(--p2); }

.roster-strip {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin: 8px 0 12px;
}
.roster-slot {
  background: var(--bg2); border: 1px dashed var(--border); border-radius: 8px;
  padding: 6px 2px; text-align: center; min-height: 52px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  font-size: 0.62rem; color: var(--muted);
}
.roster-slot.filled { border-style: solid; border-color: var(--accent); background: rgba(232,168,56,0.08); color: var(--text); }
.roster-slot .pos { font-weight: 700; color: var(--accent); font-size: 0.65rem; letter-spacing: 0.05em; }
.roster-slot .nm { font-size: 0.58rem; line-height: 1.15; margin-top: 2px; overflow: hidden; max-width: 100%; }

.spin-stage {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 20px 8px;
}
.spin-wheel {
  width: 100%; max-width: 340px; background: var(--card); border: 2px solid var(--line);
  border-radius: 16px; padding: 28px 20px; position: relative; overflow: hidden;
  box-shadow: 0 0 0 4px rgba(196,163,90,0.12), inset 0 0 40px rgba(30,58,95,0.4);
}
.spin-wheel::before {
  content: ''; position: absolute; inset: 8px; border: 1px dashed rgba(196,163,90,0.35); border-radius: 12px; pointer-events: none;
}
.spin-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.15em; color: var(--muted); margin-bottom: 8px; }
.spin-team {
  font-family: 'Bebas Neue', sans-serif; font-size: 2rem; line-height: 1.05; color: var(--text);
  min-height: 2.2em; display: flex; align-items: center; justify-content: center;
}
.spin-era {
  font-family: 'Bebas Neue', sans-serif; font-size: 2.6rem; color: var(--accent); margin-top: 6px;
}
.spin-wheel.spinning .spin-team, .spin-wheel.spinning .spin-era {
  animation: blurFlicker 0.08s infinite;
}
@keyframes blurFlicker {
  0% { filter: blur(0); opacity: 1; }
  50% { filter: blur(2px); opacity: 0.7; }
  100% { filter: blur(0); opacity: 1; }
}

.reroll-row { display: flex; gap: 8px; margin-top: 16px; width: 100%; max-width: 340px; }
.reroll-row .btn { font-size: 0.72rem; letter-spacing: 0.04em; }

.filters { display: flex; gap: 4px; margin: 8px 0; flex-wrap: wrap; }
.filters button {
  padding: 6px 12px; border-radius: 999px; background: var(--bg2); color: var(--muted);
  border: 1px solid var(--border); font-size: 0.75rem; font-weight: 600;
}
.filters button.on { background: var(--accent); color: #1a1205; border-color: var(--accent); }

.pick-list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; margin: 0 -4px; padding: 0 4px 12px; max-height: 50dvh; }
.pick-item {
  display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center;
  padding: 12px; margin-bottom: 6px; background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; cursor: pointer; transition: border-color 0.15s, background 0.15s;
}
.pick-item:hover, .pick-item:active { border-color: var(--accent); background: rgba(232,168,56,0.06); }
.pick-item .name { font-weight: 700; font-size: 0.95rem; }
.pick-item .pos-tag {
  display: inline-block; font-size: 0.65rem; font-weight: 700; color: var(--accent);
  background: rgba(232,168,56,0.12); padding: 2px 6px; border-radius: 4px; margin-left: 6px;
}
.pick-item .stats {
  display: flex; gap: 8px; margin-top: 4px; font-size: 0.7rem; color: var(--muted); flex-wrap: wrap;
}
.pick-item .stats span b { color: var(--text); font-weight: 600; }
.pick-item .ppg-big {
  font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; color: var(--accent); line-height: 1;
  text-align: right;
}
.pick-item .ppg-big small { display: block; font-family: 'IBM Plex Sans', sans-serif; font-size: 0.6rem; color: var(--muted); font-weight: 500; letter-spacing: 0.05em; }

.court {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0;
  padding: 16px; background: linear-gradient(180deg, #163050 0%, #0f2438 100%);
  border: 2px solid var(--line); border-radius: 16px; position: relative;
}
.court::after {
  content: ''; position: absolute; left: 20%; right: 20%; top: 50%; height: 1px;
  background: rgba(196,163,90,0.3); pointer-events: none;
}
.court-slot {
  background: rgba(0,0,0,0.25); border: 2px dashed rgba(196,163,90,0.3);
  border-radius: 12px; padding: 14px 8px; text-align: center; min-height: 72px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: all 0.15s; color: var(--muted); font-size: 0.75rem;
}
.court-slot .pos-label { font-weight: 700; color: var(--line); font-size: 0.8rem; letter-spacing: 0.08em; }
.court-slot.eligible {
  border-color: var(--accent); border-style: solid; background: rgba(232,168,56,0.15);
  color: var(--accent); cursor: pointer; animation: pulse 1.2s infinite;
}
.court-slot.filled { border-style: solid; border-color: var(--green); background: rgba(46,204,113,0.1); color: var(--text); }
.court-slot.filled .pos-label { color: var(--green); }
.court-slot.disabled { opacity: 0.35; pointer-events: none; }
.court-slot.pg { grid-column: 2; }
.court-slot.sg { grid-column: 1; }
.court-slot.sf { grid-column: 3; }
.court-slot.pf { grid-column: 1; }
.court-slot.c { grid-column: 2; }
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(232,168,56,0.4); }
  50% { box-shadow: 0 0 0 6px rgba(232,168,56,0); }
}

.picked-banner {
  text-align: center; padding: 12px; background: var(--card); border-radius: 12px;
  border: 1px solid var(--border); margin-bottom: 8px;
}
.picked-banner .nm { font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; color: var(--accent); }
.picked-banner .hint { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }

.result-hero { text-align: center; padding: 20px 12px; }
.result-hero .wl {
  font-family: 'Bebas Neue', sans-serif; font-size: 4rem; line-height: 1; color: var(--accent);
  text-shadow: 0 0 30px rgba(232,168,56,0.4);
}
.result-hero .grade {
  display: inline-block; margin-top: 8px; padding: 6px 16px; border-radius: 999px;
  background: rgba(232,168,56,0.15); color: var(--accent2); font-weight: 700;
  letter-spacing: 0.08em; font-size: 0.9rem;
}
.result-hero .strength { color: var(--muted); font-size: 0.85rem; margin-top: 6px; }

.h2h-banner {
  text-align: center; padding: 16px; border-radius: 14px; margin: 12px 0;
  background: linear-gradient(135deg, rgba(232,168,56,0.2), rgba(93,173,226,0.15));
  border: 1px solid var(--accent);
}
.h2h-banner .winner {
  font-family: 'Bebas Neue', sans-serif; font-size: 2rem; color: var(--accent);
}
.h2h-banner .sub { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }

.compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.compare-col { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; }
.compare-col.win { border-color: var(--accent); }
.compare-col h4 { font-size: 0.95rem; margin-bottom: 6px; }
.compare-col .wl-sm { font-family: 'Bebas Neue', sans-serif; font-size: 1.8rem; color: var(--accent); }

.roster-table { width: 100%; font-size: 0.72rem; border-collapse: collapse; margin-top: 8px; }
.roster-table th { color: var(--muted); font-weight: 600; text-align: left; padding: 4px 2px; border-bottom: 1px solid var(--border); }
.roster-table td { padding: 6px 2px; border-bottom: 1px solid rgba(42,53,72,0.5); vertical-align: top; }
.roster-table .tot { font-weight: 700; color: var(--accent); border-top: 1px solid var(--accent); }

.code-box {
  background: var(--bg2); border: 1px dashed var(--accent); border-radius: 12px;
  padding: 14px; word-break: break-all; font-family: ui-monospace, monospace;
  font-size: 0.72rem; color: var(--accent2); margin: 10px 0; max-height: 120px; overflow-y: auto;
}

.footer-note {
  text-align: center; font-size: 0.65rem; color: var(--muted); padding: 16px 12px 24px;
  opacity: 0.75; line-height: 1.4;
}

.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  background: var(--bg3); border: 1px solid var(--border); color: var(--text);
  padding: 10px 18px; border-radius: 999px; font-size: 0.85rem; z-index: 99;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4); display: none;
}
.toast.show { display: block; animation: fadeIn 0.2s ease; }

.pool-chip {
  display: inline-block; background: rgba(232,168,56,0.1); color: var(--accent2);
  padding: 4px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; margin: 4px 2px;
}
</style>
</head>

// --- Seeded RNG (mulberry32) ---
function hashStr(s) {
  let h = 1779033703 ^ s.length;
  for (let i = 0; i < s.length; i++) {
    h = Math.imul(h ^ s.charCodeAt(i), 3432918353);
    h = (h << 13) | (h >>> 19);
  }
  return (h >>> 0);
}
function mulberry32(a) {
  return function() {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function pickNPools(rng, n) {
  const idx = [...POOLS.keys()];
  for (let i = idx.length - 1; i > 0; i--) {
    const j = Math.floor(rng() * (i + 1));
    [idx[i], idx[j]] = [idx[j], idx[i]];
  }
  // Prefer unique franchises
  const used = new Set();
  const out = [];
  for (const i of idx) {
    const p = POOLS[i];
    if (used.has(p.f)) continue;
    used.add(p.f);
    out.push({ f: p.f, d: p.d, label: p.label });
    if (out.length >= n) break;
  }
  // fallback if not enough unique
  while (out.length < n) {
    const p = POOLS[Math.floor(rng() * POOLS.length)];
    out.push({ f: p.f, d: p.d, label: p.label });
  }
  return out;
}

function playerStrength(pl) {
  return pl.ppg + pl.rpg + pl.apg + pl.spg * 2 + pl.bpg * 2;
}

function rosterStrength(roster) {
  return roster.reduce((s, r) => s + (r ? playerStrength(r.player) : 0), 0);
}

// Non-linear curve: avg ~ mid-50s, god squad high 70s / rare 82
function strengthToWins(str) {
  // Tuned: average five ≈ mid-50s; elite can reach high 70s; rare 82
  const x = Math.max(0, str - 95);
  let wins = 24 + 58 * (1 - Math.exp(-x / 72));
  if (str > 240) wins += (str - 240) * 0.06;
  return Math.max(0, Math.min(82, Math.round(wins)));
}

  if (wins >= 75) return { g: "A+", label: "DYNASTY" };
  if (wins >= 70) return { g: "A", label: "ELITE" };
  if (wins >= 65) return { g: "A-", label: "CONTENDER" };
  if (wins >= 58) return { g: "B+", label: "SOLID" };
  if (wins >= 52) return { g: "B", label: "COMPETITIVE" };
  if (wins >= 45) return { g: "C+", label: "AVERAGE" };
  if (wins >= 38) return { g: "C", label: "REBUILDING" };
  if (wins >= 30) return { g: "D", label: "LOTTERY" };
  return { g: "F", label: "TANK" };
}

function fmtStat(v, old) {
  if (v == null || (old && v === 0)) return "–";
  return Number(v).toFixed(1);
}

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast._tm);
  toast._tm = setTimeout(() => t.classList.remove("show"), 2200);
}

function encodeChallenge(payload) {
  const json = JSON.stringify(payload);
  return btoa(unescape(encodeURIComponent(json))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function decodeChallenge(code) {
  try {
    let s = code.trim().replace(/-/g, "+").replace(/_/g, "/");
    while (s.length % 4) s += "=";
    return JSON.parse(decodeURIComponent(escape(atob(s))));
  } catch (e) {
    return null;
  }
}

// --- App State ---
const state = {
  mode: "pass", // pass | challenge_create | challenge_accept
  p1Name: "Player 1",
  p2Name: "Player 2",
  spins: [],
  currentPlayer: 1,
  round: 0,
  roster: { 1: [null,null,null,null,null], 2: [null,null,null,null,null] },
  rerolls: { 1: { team: 1, era: 1 }, 2: { team: 1, era: 1 } },
  currentSpin: null,
  pendingPlayer: null,
  filter: "ALL",
  results: { 1: null, 2: null },
  challengeCode: null,
  seed: null,
  phase: "home", // home, spin, pick, place, result, challenge_share, challenge_enter
};

function emptyRoster() { return [null, null, null, null, null]; }

function resetMatch(keepNames) {
  const p1 = keepNames ? state.p1Name : "Player 1";
  const p2 = keepNames ? state.p2Name : "Player 2";
  Object.assign(state, {
    p1Name: p1, p2Name: p2,
    spins: [], currentPlayer: 1, round: 0,
    roster: { 1: emptyRoster(), 2: emptyRoster() },
    rerolls: { 1: { team: 1, era: 1 }, 2: { team: 1, era: 1 } },
    currentSpin: null, pendingPlayer: null, filter: "ALL",
    results: { 1: null, 2: null },
    challengeCode: null, seed: null,
  });
}

function playerName(n) { return n === 1 ? state.p1Name : state.p2Name; }

function getPoolPlayers(spin) {
  return (PLAYERS[spin.f] && PLAYERS[spin.f][spin.d]) ? PLAYERS[spin.f][spin.d].slice() : [];
}

function availablePositions(roster, elig) {
  return POSITIONS.filter((pos, i) => !roster[i] && elig.includes(pos));
}

function computeResult(roster) {
  const str = rosterStrength(roster);
  const wins = strengthToWins(str);
  const grade = letterGrade(wins);
  const totals = { ppg: 0, rpg: 0, apg: 0, spg: 0, bpg: 0 };
  roster.forEach(r => {
    if (!r) return;
    totals.ppg += r.player.ppg;
    totals.rpg += r.player.rpg;
    totals.apg += r.player.apg;
    totals.spg += r.player.spg;
    totals.bpg += r.player.bpg;
  });
  return { strength: Math.round(str * 10) / 10, wins, losses: 82 - wins, grade, totals, roster: roster.map(r => r) };
}

// --- Game flow ---
function beginPassPlay() {
  resetMatch(true);
  state.mode = "pass";
  state.seed = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const rng = mulberry32(hashStr(state.seed));
  state.spins = pickNPools(rng, 5);
  state.currentPlayer = 1;
  state.round = 0;
  startRoundSpin();
}

function beginChallengeCreate() {
  resetMatch(true);
  state.mode = "challenge_create";
  state.p2Name = "Challenger";
  state.seed = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const rng = mulberry32(hashStr(state.seed));
  state.spins = pickNPools(rng, 5);
  state.currentPlayer = 1;
  state.round = 0;
  startRoundSpin();
}

function startRoundSpin() {
  state.currentSpin = JSON.parse(JSON.stringify(state.spins[state.round]));
  state._spinning = true;
  state.pendingPlayer = null;
  state.filter = "ALL";
  show("spin");
  // animate
  const labels = POOLS.map(p => p.label);
  const eras = DECADES;
  let ticks = 0;
  const iv = setInterval(() => {
    const teamEl = document.getElementById("spinTeam");
    const eraEl = document.getElementById("spinEra");
    if (teamEl) teamEl.textContent = labels[Math.floor(Math.random() * labels.length)];
    if (eraEl) eraEl.textContent = eras[Math.floor(Math.random() * eras.length)];
    ticks++;
    if (ticks > 18) {
      clearInterval(iv);
      state._spinning = false;
      show("spin");
    }
  }, 50);
}

function doRerollTeam() {
  const rr = state.rerolls[state.currentPlayer];
  if (rr.team < 1) return;
  rr.team--;
  const used = new Set(state.spins.map(s => s.f));
  used.delete(state.currentSpin.f);
  const candidates = POOLS.filter(p => p.d === state.currentSpin.d && !used.has(p.f));
  const pool = candidates.length ? candidates : POOLS.filter(p => p.d === state.currentSpin.d);
  if (!pool.length) { toast("No alternate teams for this era"); rr.team++; return; }
  const pick = pool[Math.floor(Math.random() * pool.length)];
  state.currentSpin = { f: pick.f, d: pick.d, label: pick.label };
  // Also update the shared spin for this round so P2 sees the re-roll in pass mode? 
  // Spec: re-rolls are per-player. In pass & play, each player drafts from possibly different pools if they re-roll.
  // But "BOTH players get the SAME five spins" — re-rolls are personal deviations for that player's pick only.
  // For challenge codes we store original spins; P1 re-rolls only affect P1's pick for that round.
  toast("Team re-rolled!");
  show("spin");
}

function doRerollEra() {
  const rr = state.rerolls[state.currentPlayer];
  if (rr.era < 1) return;
  rr.era--;
  const fran = state.currentSpin.f;
  const available = Object.keys(PLAYERS[fran] || {}).filter(d => d !== state.currentSpin.d);
  if (!available.length) { toast("No other eras for this franchise"); rr.era++; return; }
  const d = available[Math.floor(Math.random() * available.length)];
  const hist = POOLS.find(p => p.f === fran && p.d === d);
  state.currentSpin = { f: fran, d, label: hist ? hist.label : fran };
  toast("Era re-rolled!");
  show("spin");
}

function placePlayer(posIdx) {
  const pl = state.pendingPlayer;
  const roster = state.roster[state.currentPlayer];
  if (roster[posIdx]) return;
  if (!pl.el.includes(POSITIONS[posIdx])) return;
  roster[posIdx] = { player: pl, posIdx, spin: JSON.parse(JSON.stringify(state.currentSpin)) };

  // advance
  if (state.mode === "pass") {
    if (state.currentPlayer === 1) {
      // P2 drafts same round
      state.currentPlayer = 2;
      state.pendingPlayer = null;
      startRoundSpin();
    } else {
      // both done this round
      state.currentPlayer = 1;
      state.round++;
      state.pendingPlayer = null;
      if (state.round >= 5) finishMatch();
      else startRoundSpin();
    }
  } else {
    // challenge: single player drafts all 5
    state.round++;
    state.pendingPlayer = null;
    if (state.round >= 5) finishMatch();
    else startRoundSpin();
  }
}

function finishMatch() {
  if (state.mode === "pass") {
    state.results[1] = computeResult(state.roster[1]);
    state.results[2] = computeResult(state.roster[2]);
    show("result");
  } else if (state.mode === "challenge_create") {
    state.results[1] = computeResult(state.roster[1]);
    show("challenge_share");
  } else if (state.mode === "challenge_accept") {
    state.results[2] = computeResult(state.roster[2]);
    show("result");
  }
}

function loadChallenge(code) {
  const data = decodeChallenge(code);
  if (!data || !data.spins || !data.roster) {
    toast("Invalid challenge code");
    return;
  }
  resetMatch(true);
  state.mode = "challenge_accept";
  state.seed = data.seed;
  state.spins = data.spins;
  state.p1Name = data.p1 || "Player 1";
  // rebuild P1 roster from names
  const roster1 = emptyRoster();
  data.roster.forEach((entry, i) => {
    if (!entry) return;
    const pool = (PLAYERS[entry.f] && PLAYERS[entry.f][entry.d]) || [];
    const pl = pool.find(x => x.n === entry.n);
    if (pl) {
      const hist = POOLS.find(p => p.f === entry.f && p.d === entry.d);
      roster1[entry.pos] = { player: pl, posIdx: entry.pos, spin: { f: entry.f, d: entry.d, label: hist ? hist.label : entry.f } };
    }
  });
  state.roster[1] = roster1;
  state.results[1] = computeResult(roster1);
  // Override with stored if present
  if (data.wins != null) {
    state.results[1].wins = data.wins;
    state.results[1].losses = 82 - data.wins;
    if (data.strength != null) state.results[1].strength = data.strength;
    state.results[1].grade = letterGrade(data.wins);
  }
  state.currentPlayer = 2;
  state.round = 0;
  state.rerolls[2] = { team: 1, era: 1 };
  startRoundSpin();
}

function bindEvents() {
  const $ = (id) => document.getElementById(id);
  if ($("tabPass")) $("tabPass").onclick = () => { state.mode = "pass"; show("home"); };
  if ($("tabChallenge")) $("tabChallenge").onclick = () => { state.mode = "challenge_create"; show("home"); };
  if ($("startPass")) $("startPass").onclick = () => {
    state.p1Name = ($("p1in").value || "Player 1").trim();
    state.p2Name = ($("p2in").value || "Player 2").trim();
    beginPassPlay();
  };
  if ($("startCreate")) $("startCreate").onclick = () => {
    state.p1Name = ($("cName").value || "Player 1").trim();
    beginChallengeCreate();
  };
  if ($("startAccept")) $("startAccept").onclick = () => show("challenge_enter");
  if ($("backHome")) $("backHome").onclick = () => show("home");
  if ($("loadCode")) $("loadCode").onclick = () => {
    state.p2Name = ($("p2in").value || "Player 2").trim();
    loadChallenge($("codeIn").value);
  };
  if ($("confirmSpin")) $("confirmSpin").onclick = () => show("pick");
  if ($("rerollTeam")) $("rerollTeam").onclick = doRerollTeam;
  if ($("rerollEra")) $("rerollEra").onclick = doRerollEra;
  if ($("backSpin")) $("backSpin").onclick = () => show("spin");
  if ($("backPick")) $("backPick").onclick = () => { state.pendingPlayer = null; show("pick"); };
  document.querySelectorAll("[data-filter]").forEach(btn => {
    btn.onclick = () => { state.filter = btn.getAttribute("data-filter"); show("pick"); };
  });
  document.querySelectorAll(".pick-item").forEach(el => {
    el.onclick = () => {
      const idx = +el.getAttribute("data-idx");
      state.pendingPlayer = state._filteredList[idx];
      show("place");
    };
  });
  document.querySelectorAll(".court-slot.eligible").forEach(el => {
    el.onclick = () => placePlayer(+el.getAttribute("data-pos"));
  });
  if ($("copyCode")) $("copyCode").onclick = async () => {
    try {
      await navigator.clipboard.writeText(state.challengeCode || $("codeBox").textContent);
      toast("Code copied!");
    } catch (e) {
      toast("Select & copy the code manually");
    }
  };
  if ($("toShare")) $("toShare").onclick = () => show("challenge_share");
  if ($("newMatch")) $("newMatch").onclick = () => { resetMatch(true); state.mode = "pass"; show("home"); };
  if ($("rematch")) $("rematch").onclick = () => {
    if (state.mode === "challenge_accept" || state.mode === "challenge_create") {
      resetMatch(true); state.mode = "pass"; show("home");
    } else beginPassPlay();
  };
}

// boot
show("home");

</script>
</body>
</html>
